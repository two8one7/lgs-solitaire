<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" role="img" aria-labelledby="title">
  <title id="title">Broche Ballet</title>
  <defs>
    <linearGradient id="velvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1822"/>
      <stop offset="1" stop-color="#1B0E14"/>
    </linearGradient>
  </defs>
  <rect width="300" height="80" rx="6" fill="url(#velvet)"/>
  <!-- barre with hanging tassel ornament -->
  <line x1="18" y1="22" x2="282" y2="22" stroke="#C9A66B" stroke-width="1.5" opacity="0.7"/>
  <circle cx="18" cy="22" r="3" fill="#C9A66B"/>
  <circle cx="282" cy="22" r="3" fill="#C9A66B"/>
  <!-- center medallion: B initial in a wreath -->
  <circle cx="150" cy="22" r="6" fill="none" stroke="#B23A6E" stroke-width="1.2"/>
  <circle cx="150" cy="22" r="2.4" fill="#C9A66B"/>
  <!-- wordmark: BROCHE in Playfair-style large serif -->
  <text x="150" y="50" font-family="Playfair Display, Georgia, serif" font-size="22" font-weight="800" fill="#F4E6D8" text-anchor="middle" letter-spacing="4">BROCHE</text>
  <!-- subtitle: BALLET, smaller, rose, tracked wide -->
  <text x="150" y="68" font-family="Lora, Georgia, serif" font-size="11" font-weight="500" fill="#B23A6E" text-anchor="middle" letter-spacing="9">BALLET</text>
</svg>
